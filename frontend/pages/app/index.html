<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — PureSkin</title>
  <!-- Must stay first: redirects to /auth/ before render if there's no token. -->
  <script src="/static/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/app/dashboard.css">
</head>
<body>
  <nav id="app-nav" class="app-nav" aria-label="Main"></nav>

  <main class="page">
    <h1 class="page__title">Dashboard</h1>

    <div id="save-notice" class="warning-box dashboard__notice" role="status" hidden></div>

    <section id="summary" class="dashboard__summary" aria-live="polite">
      <p class="status">Loading your skin summary…</p>
    </section>

    <h2 class="dashboard__heading">Quick links</h2>
    <ul class="quick-links">
      <li>
        <a class="quick-link" href="/app/routine/">
          <span class="quick-link__title">Your routine</span>
          <span class="quick-link__text">AM and PM steps matched to your Skin Profile</span>
        </a>
      </li>
      <li>
        <a class="quick-link" href="/app/catalog/">
          <span class="quick-link__title">Product catalog</span>
          <span class="quick-link__text">Search products and check their ingredients</span>
        </a>
      </li>
      <li>
        <a class="quick-link" href="/app/chat/">
          <span class="quick-link__title">Ask the advisor</span>
          <span class="quick-link__text">Skincare questions answered for your skin</span>
        </a>
      </li>
    </ul>
  </main>

  <script src="/static/js/nav.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/bands.js"></script>
  <script src="/static/js/ui.js"></script>
  <!-- No data-requires: loaded for the scan result's sessionStorage keys/helpers.
       data-outside-funnel drops any leftover photo / retake answers from the tab. -->
  <script src="/static/js/scan-guard.js" data-outside-funnel></script>
  <script src="/static/js/scan-api.js"></script>
  <script src="/app/dashboard.js"></script>
</body>
</html>
