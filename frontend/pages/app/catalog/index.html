<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Product Catalog — PureSkin</title>
  <!-- Must stay first: redirects to /auth/ before render if there's no token. -->
  <script src="/static/js/auth-guard.js"></script>
  <link rel="preload" href="/static/fonts/archivo/Archivo-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/app/catalog/catalog.css">
</head>
<body data-photo="1">
  <nav id="app-nav" class="app-nav" aria-label="Main"></nav>
  <!-- Below 1024px the photo band; from 1024px the photo is the page background (main.css). -->
  <div class="photo-band" aria-hidden="true"></div>

  <main class="page">
    <h1 class="page__title">Product Catalog</h1>
    <p class="page-note" role="note">Ingredient lists are copied from brand pages and may differ by market
      or batch. <strong>Global ingredient list:</strong> the list comes from the brand's non-India
      website; the version sold in India may differ.</p>
    <form id="catalog-filters" class="catalog-filters" role="search">
      <label class="catalog-filters__field">
        <span>Search</span>
        <input id="catalog-search" type="search" name="search" placeholder="Product or brand" autocomplete="off">
      </label>
      <label class="catalog-filters__field">
        <span>Category</span>
        <select id="catalog-category" name="category">
          <option value="">All categories</option>
        </select>
      </label>
    </form>

    <p id="catalog-count" class="catalog-count" aria-live="polite"></p>
    <ul id="catalog-grid" class="catalog-grid"></ul>

    <nav class="pagination" aria-label="Catalog pages">
      <button type="button" id="page-prev" class="btn btn--secondary" disabled>Previous</button>
      <span id="page-info" class="pagination__info"></span>
      <button type="button" id="page-next" class="btn btn--secondary" disabled>Next</button>
    </nav>
  </main>

  <script src="/static/js/nav.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/app/catalog/catalog.js"></script>
</body>
</html>
