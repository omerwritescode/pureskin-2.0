<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — PureSkin</title>
  <!-- Must stay first: redirects to /auth/ before render if there's no token. -->
  <script src="/static/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/app/settings/settings.css">
</head>
<body>
  <nav id="app-nav" class="app-nav" aria-label="Main"></nav>

  <main class="page">
    <h1 class="page__title">Settings</h1>

    <ul class="settings-links">
      <li>
        <a class="settings-link" href="/app/settings/privacy/">
          <span class="settings-link__title">Privacy and your data</span>
          <span class="settings-link__text">What PureSkin stores, download your data, delete your account</span>
        </a>
      </li>
      <li>
        <a class="settings-link" href="/app/settings/account/">
          <span class="settings-link__title">Account</span>
          <span class="settings-link__text">Your email address and name; log out</span>
        </a>
      </li>
      <li>
        <div class="settings-link settings-link--unavailable">
          <span class="settings-link__title">Subscription</span>
          <span class="settings-link__text">Subscriptions aren't available in this version.</span>
        </div>
      </li>
    </ul>
  </main>

  <script src="/static/js/nav.js"></script>
  <script src="/app/settings/settings.js"></script>
</body>
</html>
