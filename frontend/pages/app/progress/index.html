<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress — PureSkin</title>
  <!-- Must stay first: redirects to /auth/ before render if there's no token. -->
  <script src="/static/js/auth-guard.js"></script>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/app/progress/progress.css">
</head>
<body>
  <nav id="app-nav" class="app-nav" aria-label="Main"></nav>

  <main class="page">
    <h1 class="page__title">Progress</h1>

    <section id="progress" class="progress" aria-live="polite">
      <p class="status">Loading your scans…</p>
    </section>

    <div class="progress-notes">
      <p>These scores are unvalidated heuristics and self-reports, not clinical measurements.</p>
      <p>A change between scans may not be a change in your skin. Each score comes from your photo, your answers, or a set blend of the two, and photo-based scores change with lighting.</p>
    </div>
  </main>

  <script src="/static/js/nav.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/bands.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/app/progress/progress.js"></script>
</body>
</html>
