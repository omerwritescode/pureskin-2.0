<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Skin Report — PureSkin</title>
  <!-- Must stay first: sends the visitor back to /scan/ if there's no result yet. -->
  <script src="/static/js/scan-guard.js" data-requires="pureskin_scan_result"></script>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/scan/report/report.css">
</head>
<body>
  <header class="site-header"><div class="site-header__inner">PureSkin</div></header>

  <main class="page">
    <p class="scan-step">Step 3 of 3</p>
    <h1 class="page__title">Your Skin Report</h1>
    <p class="report-type">Skin type: <strong id="skin-type"></strong></p>

    <p class="report-note">
      Preview: these scores are sample data while our skin-analysis model is in development.
    </p>

    <section aria-labelledby="scores-heading">
      <h2 id="scores-heading" class="report-heading">Scores</h2>
      <p class="report-help">1–100 · higher means more noticeable</p>
      <ul id="scores" class="scores"></ul>
    </section>

    <div class="report-cta">
      <a href="/auth/#signup" class="btn">Save your results — Sign Up</a>
      <p class="report-login">Already have an account? <a href="/auth/">Log in</a></p>
      <p class="report-login"><a href="/scan/">Start a new scan</a></p>
    </div>
  </main>

  <script src="/scan/report/report.js"></script>
</body>
</html>
